<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/portadmin/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Admin</title>
  </head>
  <body style="background-color: #09090b; margin: 0;">
    <div id="app">
      <div style="min-height: 100vh; display: flex; background: #09090b; color: #f4f4f5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="width: 240px; border-right: 1px solid #27272a; padding: 20px 16px; display: none; background: #121215;" class="init-sidebar">
          <div style="height: 28px; width: 140px; background: #27272a; border-radius: 6px; margin-bottom: 32px;"></div>
          <div style="height: 36px; width: 100%; background: #1f1f23; border-radius: 6px; margin-bottom: 8px;"></div>
          <div style="height: 36px; width: 100%; background: #18181b; border-radius: 6px; margin-bottom: 8px;"></div>
          <div style="height: 36px; width: 100%; background: #18181b; border-radius: 6px; margin-bottom: 8px;"></div>
        </div>
        <div style="flex: 1; padding: 24px 32px; max-width: 1024px; margin: 0 auto; width: 100%;">
          <div style="height: 32px; width: 200px; background: #27272a; border-radius: 6px; margin-bottom: 8px;"></div>
          <div style="height: 16px; width: 300px; background: #18181b; border-radius: 4px; margin-bottom: 28px;"></div>
          <div style="border: 1px solid #27272a; border-radius: 8px; background: #121215; padding: 20px; margin-bottom: 20px;">
            <div style="height: 18px; width: 160px; background: #27272a; border-radius: 4px; margin-bottom: 20px;"></div>
            <div style="height: 40px; width: 100%; background: #18181b; border-radius: 6px; margin-bottom: 16px;"></div>
            <div style="height: 40px; width: 100%; background: #18181b; border-radius: 6px;"></div>
          </div>
          <div style="border: 1px solid #27272a; border-radius: 8px; background: #121215; padding: 20px;">
            <div style="height: 18px; width: 140px; background: #27272a; border-radius: 4px; margin-bottom: 20px;"></div>
            <div style="height: 40px; width: 100%; background: #18181b; border-radius: 6px;"></div>
          </div>
        </div>
      </div>
      <style>
        @media (min-width: 768px) { .init-sidebar { display: flex !important; flex-direction: column; } }
      </style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
